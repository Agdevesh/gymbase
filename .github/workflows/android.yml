name: Android APK

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: ["android-app/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android-app/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # Repo variable GYMBASE_URL overrides the site the APK opens (default is in capacitor.config.ts).
      GYMBASE_URL: ${{ vars.GYMBASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: android-app/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      # ubuntu-latest ships the Android SDK (ANDROID_HOME set); Gradle fetches the platform and build-tools it needs.
      - uses: gradle/actions/setup-gradle@v4

      - name: Install Capacitor and sync the Android project
        working-directory: android-app
        run: |
          npm ci
          npx cap sync android

      - name: Prepare signing key
        # Set the ANDROID_KEYSTORE_* repo secrets to sign every build with the same key (required for in-place updates
        # and for the Play Store). Without them a throwaway key is generated, so users must uninstall before updating.
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "Using the repository's release keystore"
          else
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/release.keystore" -storepass gymbase1 -keypass gymbase1 \
              -alias gymbase -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=GYMBASE, O=GYMBASE, C=IN"
            echo "ANDROID_KEYSTORE_PASSWORD=gymbase1" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=gymbase" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=gymbase1" >> "$GITHUB_ENV"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret; signed with a throwaway key (see PROGRESS.md)"
          fi
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: android-app/android
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('0.1.{0}', github.run_number) }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/gymbase.apk"
          ls -la "$RUNNER_TEMP/gymbase.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: gymbase-apk
          path: ${{ runner.temp }}/gymbase.apk

      # Every main push touching the Android shell (and every manual run from main) publishes a release, so
      # /install's "latest release" link always has an APK. A v* tag publishes under that tag instead.
      - name: Publish release
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('android-v0.1.{0}', github.run_number) }}
          name: GYMBASE Android ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('0.1.{0}', github.run_number) }}
          files: ${{ runner.temp }}/gymbase.apk
          generate_release_notes: true
